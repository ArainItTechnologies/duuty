name: CI Build and Deploy To Azure

env:
  HAS_DB_MIGRATION: ${{ vars.HAS_DB_MIGRATION }}
  AZURE_WEBAPP_NAME: duuty-stg
  AZURE_WEBAPP_PACKAGE_PATH: '.'  
  DOTNET_VERSION: '9'             

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up dependency caching for faster builds
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build with dotnet
        run: dotnet build DuutyApp/DuutyApp.sln --configuration Release

      - name: Replace variables in appsettings.json
        uses: microsoft/variable-substitution@v1
        with:
          files: 'DuutyApp/DuutyApp.Server/appsettings.json'
        env:
          ConnectionStrings.DuutyAppDbContext: ${{ secrets.DATABASE_CONNECTION_STRING }}
          JwtSettings.SecretKey: ${{ secrets.JWT_SECRET_KEY }}
          SeedUserConfigs: ${{ secrets.SEED_USER_CONFIGS }}
          TwilioSettings: ${{secrets.TWILIO_SETTINGS}}
          SmptpConfig: ${{secrets.SMTP_CONFIG}}
          
      - name: dotnet publish
        run: dotnet publish DuutyApp/DuutyApp.Server/DuutyApp.Server.csproj -c Release -o ${{env.DOTNET_ROOT}}/duuty
        
      - name: Install EF Core Tools
        run: dotnet tool install --global dotnet-ef
        
      - name: Run EF Core Migrations
        if: env.HAS_DB_MIGRATION == 'true'
        run: |
          # Run EF Core migrations (using the Azure App Service connection string or other methods)
          dotnet-ef database update --project DuutyApp/DuutyApp.Data/DuutyApp.Data.csproj --startup-project DuutyApp/DuutyApp.Server/DuutyApp.Server.csproj --connection $DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DB_CONNECTION }}

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: duutyApp
          path: ${{env.DOTNET_ROOT}}/duuty
          if-no-files-found: error

  deploy:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Development'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: duutyApp

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
          restart: true
